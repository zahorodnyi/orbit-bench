[package]
name = "orbit-bench"
version = "0.1.0"
edition = "2021"
description = "N-Body galaxy gravity simulation benchmark for CPU profiling, SIMD optimization, and energy analysis"

[dependencies]
# Pure std: zero external dependencies to measure clean computational code.

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = true
codegen-units = 1
lto = false
